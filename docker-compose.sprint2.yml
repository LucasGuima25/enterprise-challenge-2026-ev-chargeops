services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chargeops
      POSTGRES_USER: chargeops
      POSTGRES_PASSWORD: chargeops_local
    ports:
      - "5432:5432"
    volumes:
      - chargeops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargeops -d chargeops"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  chargeops_pgdata:
